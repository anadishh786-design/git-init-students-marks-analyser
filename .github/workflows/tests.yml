name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -v

      - name: Run dashboard search tests
        run: node --test test_dashboard_search.js
